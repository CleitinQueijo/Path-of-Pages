<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> Path of Pages </title>
<style>
html,body { height:100%; margin:0; background:#111; display:flex; align-items:center; justify-content:center; font-family:Segoe UI, Arial, sans-serif; color:#fff; }
#game-wrap { width:960px; max-width:96vw; aspect-ratio:16/9; background:#000; position:relative; image-rendering:pixelated; box-shadow:0 10px 30px rgba(0,0,0,.7); }
canvas { width:100%; height:100%; display:block; image-rendering:pixelated; cursor:none; }
/* MODIFICAÇÃO: Ocultado HUD por padrão */
.hud { position:absolute; left:8px; top:8px; z-index:5; font-weight:700; letter-spacing:0.5px; display: none; }
.hud .line { margin-bottom:6px; padding:6px 10px; background:rgba(0,0,0,0.45); border-radius:6px; display:inline-block; }
.center-msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:6; pointer-events:none; }
.center-msg .box { pointer-events:auto; padding:18px 22px; background:rgba(0,0,0,0.7); border-radius:8px; text-align:center; }
button { margin-top:10px; padding:8px 12px; border-radius:6px; border:0; background:#ffcc00; font-weight:700; cursor:pointer; }
.center-msg .box button { margin: 8px; }
/* MODIFICAÇÃO: Ocultados os controles permanentemente da tela de jogo */
.controls { position:absolute; right:8px; top:8px; z-index:5; background:rgba(0,0,0,0.35); padding:8px;border-radius:8px; font-size:13px; display: none; }
.touch-controls { position:absolute; bottom:12px; left:12px; z-index:7; display:none; gap:8px; }
.touch-controls button { opacity:.9; font-weight:700; padding:12px; border-radius:8px; }
@media (pointer: coarse) { .touch-controls{ display:flex; } }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="line" id="levelTxt">Nível: 1 / 10</div>
          </div>
  
  <div class="controls">
    WASD / ←→ — mover · Espaço / W — pular · R — reiniciar · Esc — pausar
  </div>
  
  <div class="touch-controls">
    <button id="leftBtn">◀</button>
    <button id="jumpBtn">▲</button>
    <button id="rightBtn">▶</button>
  </div>

  <div class="center-msg" id="centerMsg">
    <div class="box" id="centerBox">
      <div style="font-size:20px; margin-bottom:6px"> Path of Pages </div>
      <div style="opacity:.8; font-size:13px">Pegue todos os livros. Evite espinhos. 10 níveis.</div>
      <button id="startBtn">Jogar</button>
    </div>
  </div>

  <div class="center-msg" id="pauseMenu" style="display:none;">
    <div class="box" id="pauseBox">
      <div style="font-size:20px; margin-bottom:12px">Jogo Pausado</div>
      <button id="continueGameBtn" style="margin-bottom:8px;">Continuar</button>
      <button id="toStartBtn">Tela Inicial</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const GAME_W = 800, GAME_H = 400;
canvas.width = GAME_W;
canvas.height = GAME_H;
let keys = {}, game;
let paused = false;

let gameStartTime;
let currentTimerInterval;

window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const BOOK_HEIGHT_ABOVE_PLATFORM = 20;

function generateLongLevels(difficulty) {
    const generatedLevels = [];
    const numLevels = 10;
    
    let platformsPerLevel, platformWidth, spikeChance, horizontalGapBetweenPlatforms, verticalChangeRange;
    const platformHeight = 15;
    const spikeWidth = 40;
    const spikeHeight = 10;

    if (difficulty === 'easy') {
        platformsPerLevel = 20; 
        platformWidth = 180;    
        spikeChance = 0.2;      
        horizontalGapBetweenPlatforms = { base: 60, range: 40 };
        verticalChangeRange = 60; 
    } else { // 'hard'
        platformsPerLevel = 60; 
        platformWidth = 120;    
        spikeChance = 1.0;      
        horizontalGapBetweenPlatforms = { base: 10, range: 50 };
        verticalChangeRange = 80; 
    }

    for (let i = 0; i < numLevels; i++) {
        const level = { platforms: [], spikes: [], books: [], trap: {} };
        let lastPlatform = { x: 0, y: 350, w: platformWidth, h: platformHeight };
        level.platforms.push(lastPlatform);

        for (let j = 1; j < platformsPerLevel; j++) {
            const currentGap = horizontalGapBetweenPlatforms.base + Math.random() * horizontalGapBetweenPlatforms.range;
            let newX = lastPlatform.x + lastPlatform.w + currentGap;
            
            const verticalChange = (Math.random() - 0.5) * verticalChangeRange;
            let newY = lastPlatform.y + verticalChange;

            if (newY > 380) newY = 380;
            if (newY < 150) newY = 150;

            const newPlatform = { x: newX, y: newY, w: platformWidth, h: platformHeight };
            level.platforms.push(newPlatform);

            const isFinalPlatform = (j === platformsPerLevel - 1);

            if (Math.random() < spikeChance && !isFinalPlatform) { 
                let spikeXOffset;
                if (difficulty === 'easy') {
                    spikeXOffset = (platformWidth / 2) - (spikeWidth / 2);
                } else {
                    spikeXOffset = 20 + Math.random() * (platformWidth - spikeWidth - 40);
                }
                const newSpike = { x: newPlatform.x + spikeXOffset, y: newPlatform.y - spikeHeight, w: spikeWidth };
                level.spikes.push(newSpike);
            }
            
            lastPlatform = newPlatform;
        }

        const finalPlatform = level.platforms[level.platforms.length - 1];
        level.books.push({ x: finalPlatform.x + (platformWidth/2 - 10), y: finalPlatform.y - BOOK_HEIGHT_ABOVE_PLATFORM });
        level.trap = { x: finalPlatform.x - 30, y: finalPlatform.y - 15, width: 60, active: true };
        generatedLevels.push(level);
    }
    return generatedLevels;
}

let LEVELS = [];
let particles = [];

function formatTime(ms) {
    if (ms === null || isNaN(ms)) return "N/A";
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
}

function updateTimerDisplay() {
    if (paused || !game || !game.running) return;
    const elapsedMs = Date.now() - gameStartTime;
    // document.getElementById("timerTxt").textContent = `Tempo: ${formatTime(elapsedMs)}`;
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y; this.color = color;
    this.vx = (Math.random() - 0.5) * 5;
    this.vy = (Math.random() - 1) * 5;
    this.size = Math.random() * 5 + 2;
    this.life = 60;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += 0.2; this.life--; }
  draw(ctx) { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); }
}

class Cloud {
    constructor(x, y, size, speed) { this.x = x; this.y = y; this.size = size; this.speed = speed; }
    update() {
        this.x -= this.speed;
        if (this.x + this.size < 0) {
            this.x = GAME_W + Math.random() * GAME_W;
            this.y = Math.random() * (GAME_H / 2);
            this.speed = 0.2 + Math.random() * 0.5;
            this.size = Math.random() * 10 + 20;
        }
    }
    draw(ctx) {
        // Detalhes pixelados para a nuvem
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(this.x, this.y + this.size * 0.6, this.size, this.size * 0.4);
        ctx.fillRect(this.x + this.size * 0.1, this.y + this.size * 0.3, this.size * 0.8, this.size * 0.6);
        ctx.fillRect(this.x + this.size * 0.2, this.y + this.size * 0.1, this.size * 0.6, this.size * 0.7);
        ctx.fillRect(this.x + this.size * 0.3, this.y, this.size * 0.4, this.size * 0.5);
        // Sombras sutis para dar mais profundidade
        ctx.fillStyle = "rgba(0,0,0,0.1)";
        ctx.fillRect(this.x + this.size * 0.1, this.y + this.size * 0.7, this.size * 0.6, 2);
        ctx.fillRect(this.x + this.size * 0.5, this.y + this.size * 0.4, this.size * 0.3, 2);
    }
}

class Game {
  constructor() {
    this.levelIndex=1; this.maxLevels=10; this.running=false; this.playerDead = false;
    this.clouds = []; this.initClouds();
    this.difficulty = null; 
  }
  initClouds() {
      for (let i = 0; i < 5; i++) {
          this.clouds.push(new Cloud(Math.random() * GAME_W * 2, Math.random() * (GAME_H / 2), Math.random() * 10 + 20, 0.2 + Math.random() * 0.5));
      }
  }
  start() {
    this.level = new Level(this.levelIndex);
    this.player = new Player(50,this.level.groundY-80);
    this.running=true; this.playerDead = false; particles = [];
    
    gameStartTime = Date.now();
    clearInterval(currentTimerInterval); 
    currentTimerInterval = setInterval(updateTimerDisplay, 100);
    // document.getElementById("timerTxt").textContent = "Tempo: 00:00";
    
    this.loop();
  }
  restartLevel() {
    this.level = new Level(this.levelIndex);
    this.player = new Player(50, this.level.groundY - 80);
    this.running = true; this.playerDead = false; particles = [];
    this.loop();
  }
  nextLevel() {
    this.levelIndex++;
    if(this.levelIndex > this.maxLevels){
      return;
    }
    this.level = new Level(this.levelIndex);
    this.player = new Player(50,this.level.groundY-80);
    this.playerDead = false; particles = [];
  }
  loop() {
    if(!this.running && particles.length === 0) return;
    if(!paused) { this.update(); this.draw(); }
    requestAnimationFrame(()=>this.loop());
  }
  update() {
    if(keys["r"]){
        if(this.playerDead) { game.restartLevel(); } 
        else if (!paused) { 
            paused = true;
            showCenterMsg("Reiniciar Nível?", [
                { text: "Sim", callback: () => { paused = false; game.restartLevel(); }},
                { text: "Não", callback: () => { paused = false; }}
            ]);
        }
        keys["r"] = false;
    }
    if(!this.playerDead) { this.player.update(this.level); } 
    else {
        for(let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if(particles[i].life <= 0) particles.splice(i, 1);
        }
        if(particles.length === 0) {
            this.running = false;
            clearInterval(currentTimerInterval); 
            const finalTime = Date.now() - gameStartTime; 

            if (this.levelIndex === this.maxLevels) {
                // REMOÇÃO DA LÓGICA DE RECORDE
                const finalTimeStr = formatTime(finalTime);
                let winMessage = `🎉 Parabéns! Você completou!<br>Tempo: ${finalTimeStr}`;
                // FIM DA REMOÇÃO

                showCenterMsg(winMessage, [
                    { text: "Jogar Novamente", callback: () => location.reload() },
                    { text: "Tela Inicial", callback: () => location.reload() }
                ]);
            } else {
                showCenterMsg("Você Morreu.", [
                    { text: "Tentar Novamente", callback: () => game.restartLevel() },
                    { text: "Voltar à Tela Inicial", callback: () => location.reload() }
                ]);
            }
        }
    }
    this.clouds.forEach(cloud => cloud.update());
    this.camera={x:Math.max(0,this.player.x-150)};
    document.getElementById("levelTxt").textContent = `Nível: ${this.levelIndex} / 10`;
    
    if(this.level.books.every(b=>b.collected)) {
      this.running = false;
      showCenterMsg("Livro Coletado!", [
        { text: "Continuar", callback: () => {
          this.nextLevel();
          if (this.levelIndex <= this.maxLevels) { this.running = true; this.loop(); }
        }}
      ]);
    }
  }
  drawSun(ctx) {
      const sunX = GAME_W - 100, sunY = 70, sunSize = 50;
      // Cor principal do sol
      ctx.fillStyle = "#FFFF00"; // Amarelo brilhante
      ctx.fillRect(sunX, sunY, sunSize, sunSize);

      // Efeitos de brilho e textura pixelada
      ctx.fillStyle = "#FFD700"; // Amarelo mais escuro
      ctx.fillRect(sunX + 5, sunY + 5, sunSize - 10, sunSize - 10);
      ctx.fillRect(sunX + 10, sunY + 10, sunSize - 20, sunSize - 20);

      ctx.fillStyle = "#FFC400"; // Laranja amarelado
      ctx.fillRect(sunX, sunY + sunSize / 2 - 2, sunSize, 4); // Linha horizontal
      ctx.fillRect(sunX + sunSize / 2 - 2, sunY, 4, sunSize); // Linha vertical

      // Raios pixelados
      ctx.fillStyle = "#FFCC00";
      // Raios principais
      ctx.fillRect(sunX - 10, sunY + sunSize / 2 - 2, 8, 4);
      ctx.fillRect(sunX + sunSize + 2, sunY + sunSize / 2 - 2, 8, 4);
      ctx.fillRect(sunX + sunSize / 2 - 2, sunY - 10, 4, 8);
      ctx.fillRect(sunX + sunSize / 2 - 2, sunY + sunSize + 2, 4, 8);
      // Raios diagonais
      ctx.fillRect(sunX - 5, sunY - 5, 4, 4);
      ctx.fillRect(sunX + sunSize + 1, sunY - 5, 4, 4);
      ctx.fillRect(sunX - 5, sunY + sunSize + 1, 4, 4);
      ctx.fillRect(sunX + sunSize + 1, sunY + sunSize + 1, 4, 4);
  }
  draw() {
    ctx.clearRect(0,0,GAME_W,GAME_H);
    ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, GAME_W, GAME_H); 
    this.drawSun(ctx);
    this.clouds.forEach(cloud => cloud.draw(ctx));
    ctx.save();
    ctx.translate(-this.camera.x, 0);
    for(let p of this.level.platforms)p.draw(ctx);
    for(let s of this.level.spikes)s.draw(ctx);
    for(let b of this.level.books)b.draw(ctx);
    if(!this.playerDead) { this.player.draw(ctx); }
    for(let p of particles) { p.draw(ctx); }
    ctx.restore();
  }
}

class Level {
  constructor(index){
    this.index=index; const data=LEVELS[index-1];
    this.platforms=data.platforms.map(p=>new Platform(p.x,p.y,p.w,p.h));
    this.spikes=data.spikes.map(s=>new Spike(s.x,s.y,s.w));
    this.books=data.books.map(b=>new Book(b.x,b.y));
    this.trap={...data.trap}; this.groundY=400-50;
  }
}

class Platform{
  constructor(x,y,w,h){this.x=x;this.y=y;this.w=w;this.h=h;}
  draw(ctx){
    // Cor da terra
    ctx.fillStyle="#654321";
    ctx.fillRect(this.x,this.y,this.w,this.h);

    // Grama pixelada no topo
    ctx.fillStyle="#008000"; // Verde escuro
    ctx.fillRect(this.x,this.y,this.w,4); // Camada de grama

    // Detalhes de grama
    for(let i=0; i < this.w; i+=4) {
      if(Math.random() > 0.5) { // Aleatoriedade para o padrão
        ctx.fillRect(this.x + i, this.y - 2, 2, 2); // Pontos de grama
      }
    }
    // Detalhes de terra
    ctx.fillStyle="#8B4513"; // Marrom mais claro
    ctx.fillRect(this.x,this.y + this.h - 2,this.w,2); // Base
    ctx.fillRect(this.x + this.w - 2, this.y + 4, 2, this.h - 8); // Lateral direita
    ctx.fillStyle="#A0522D"; // Marrom médio
    ctx.fillRect(this.x + 2, this.y + this.h - 4, this.w - 4, 2); // Sombra inferior
  }
}

class Spike{
    constructor(x,y,w){this.x=x;this.y=y;this.w=w;}
    draw(ctx){
      const x=this.x, y=this.y;
      ctx.fillStyle="#ff3333"; ctx.beginPath();
      ctx.moveTo(x,y+10); ctx.lineTo(x+this.w/2,y); ctx.lineTo(x+this.w,y+10);
      ctx.closePath(); ctx.fill();
      // Adicionar mais detalhes pixelados aos espinhos
      ctx.fillStyle = "#CC0000"; // Um vermelho mais escuro para a sombra
      ctx.beginPath();
      ctx.moveTo(x + this.w/4, y + 5);
      ctx.lineTo(x + this.w/2, y + 1);
      ctx.lineTo(x + 3*this.w/4, y + 5);
      ctx.fill();
    } 
}

class Player{
  constructor(x,y){
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.width=25;this.height=40;
    this.onGround=false;
    this.facingRight = true; 
    this.frame = 0; // Adicionado para animação
    this.frameTick = 0; // Adicionado para controle da velocidade da animação
  }
  die() {
    if (game.playerDead) return;
    game.playerDead = true;
    const colors = ["#ff3333", "#CC0000", "#AA0000", "#880000"]; // Tons de vermelho para sangue
    for (let i = 0; i < 80; i++) { // Aumentado para 80 partículas
        const color = colors[Math.floor(Math.random() * colors.length)];
        const particle = new Particle(
            this.x + this.width / 2 + (Math.random() - 0.5) * 10, // Pequena variação na origem
            this.y + this.height / 2 + (Math.random() - 0.5) * 10, // Pequena variação na origem
            color
        );
        particle.vx = (Math.random() - 0.5) * 8; // Velocidade horizontal maior
        particle.vy = (Math.random() - 1) * 8; // Velocidade vertical maior
        particle.size = Math.random() * 4 + 1; // Tamanho das partículas um pouco menor e mais variado
        particles.push(particle);
    }
  }
  update(level){
    this.vy+=0.8; this.x+=this.vx; this.y+=this.vy; this.vx*=0.85;
    if(keys["a"] || keys["arrowleft"]) { this.vx=-3; this.facingRight = false; }
    if(keys["d"] || keys["arrowright"]) { this.vx=3; this.facingRight = true; }
    if((keys["w"]||keys[" "] || keys["arrowup"])&&this.onGround){this.vy=-17; this.onGround=false;}
    this.onGround=false;
    for(let p of level.platforms){
      if(this.vy>=0 && this.x+this.width>p.x && this.x<p.x+p.w && this.y+this.height>p.y && this.y+this.height-this.vy<=p.y){
        this.y=p.y-this.height; this.vy=0; this.onGround=true;
      }
    }
    if(level.trap.active && this.x+this.width>level.trap.x && this.x<level.trap.x+level.trap.width && this.y+this.height>=level.trap.y){
      level.trap.active=false; this.vy=10;
    }
    for(let s of level.spikes){
      const px=this.x+this.width/2, py=this.y+this.height;
      if(px>s.x && px<s.x+s.w && py>s.y && py<s.y+10){ this.die(); return; }
      if(this.y+this.height > s.y && this.y < s.y+10 && this.x+this.width > s.x && this.x < s.x+s.w){ this.die(); return; }
    }
    
    for(let b of level.books) {
        if(!b.collected && this.x+this.width>b.x && this.x<b.x+20 && this.y+this.height>b.y && this.y<b.y+20) {
            if (game.levelIndex === game.maxLevels) {
                this.die(); 
                return; 
            } else {
                b.collected = true; 
            }
        }
    }

    if(this.y>GAME_H+100) { this.die(); }

    // Lógica de animação
    if (this.onGround && (keys["a"] || keys["d"] || keys["arrowleft"] || keys["arrowright"])) {
        this.frameTick++;
        if (this.frameTick > 8) { // Velocidade da animação de andar
            this.frame = (this.frame + 1) % 2; // 2 frames para andar (0 e 1)
            this.frameTick = 0;
        }
    } else {
        this.frame = 0; // Padrão ou pulo/queda
        this.frameTick = 0;
    }
  }
  draw(ctx){
    const x=this.x,y=this.y;
    ctx.save();

    // CORREÇÃO: Lógica de inverter o personagem
    if (!this.facingRight) {
        ctx.translate(x + this.width / 2, y);
        ctx.scale(-1, 1);
        ctx.translate(-(x + this.width / 2), -y); // Ajustar de volta para o canto superior esquerdo após o flip
    }
    
    // Definir offsets para animação
    let armOffsetY = 0;
    let armSwingX = 0;
    let legSwing = 0;

    if (!this.onGround) { // Animação de pulo
        armOffsetY = -2; // Braços para cima
    } else if (this.vx !== 0) { // Animação de andar
        if (this.frame === 0) {
            armSwingX = -2; // Braço esquerdo para trás, direito para frente
            legSwing = 2; // Perna esquerda para frente, direita para trás
        } else {
            armSwingX = 2; // Braço esquerdo para frente, direito para trás
            legSwing = -2; // Perna esquerda para trás, direita para frente
        }
    }

    // Corpo (camisa)
    ctx.fillStyle="#ffdb58"; // Amarelo
    ctx.fillRect(x+4,y+10,15,18); 

    // Cabeça
    ctx.fillStyle="#f2d2b6"; // Cor da pele
    ctx.fillRect(x+6,y,11,12); // Posição e tamanho da cabeça
    // Cabelo
    ctx.fillStyle="#333"; // Cor do cabelo
    ctx.fillRect(x+5,y,13,4);
    ctx.fillRect(x+5,y+4,2,4); // Parte lateral do cabelo
    ctx.fillRect(x+16,y+4,2,4); // Outra parte lateral do cabelo

    // Olhos simples
    ctx.fillStyle = "#000000"; // Preto para os olhos
    ctx.fillRect(x + 8, y + 5, 2, 2); // Olho esquerdo
    ctx.fillRect(x + 13, y + 5, 2, 2); // Olho direito

    // Braços (com animação)
    ctx.fillStyle="#ffdb58"; // Cor da camisa
    ctx.fillRect(x + 19 + armSwingX, y + 12 + armOffsetY, 3, 10); // Braço direito
    ctx.fillRect(x + 1 - armSwingX, y + 12 + armOffsetY, 3, 10); // Braço esquerdo

    // Mãos
    ctx.fillStyle="#f2d2b6"; // Cor da pele
    ctx.fillRect(x + 22 + armSwingX, y + 20 + armOffsetY, 3, 4); // Mão direita
    ctx.fillRect(x - 2 - armSwingX, y + 20 + armOffsetY, 3, 4); // Mão esquerda


    // Calças
    ctx.fillStyle="#336699"; // Azul escuro
    ctx.fillRect(x+4,y+28,15,8);

    // Pernas (com animação)
    ctx.fillStyle="#333"; // Cor dos sapatos
    ctx.fillRect(x+5 + legSwing,y+36,5,4); // Perna esquerda (sapato)
    ctx.fillRect(x+13 - legSwing,y+36,5,4); // Perna direita (sapato)

    ctx.restore();
  }
}

class Book{
  constructor(x,y){this.x=x;this.y=y;this.collected=false;}
  draw(ctx){
    if(!this.collected){
      // Capa do livro
      ctx.fillStyle="#0088CC"; // Azul vibrante
      ctx.fillRect(this.x,this.y,16,20);
      // Lombada
      ctx.fillStyle="#006699"; // Azul mais escuro
      ctx.fillRect(this.x,this.y,2,20);
      // Páginas
      ctx.fillStyle="#EEEEEE"; // Branco para as páginas
      ctx.fillRect(this.x+2,this.y+2,14,16);
      // Detalhe da capa (fecho ou símbolo)
      ctx.fillStyle="#FFD700"; // Dourado
      ctx.fillRect(this.x+5,this.y+5,6,2);
      ctx.fillRect(this.x+5,this.y+13,6,2);
    }
  }
}

function togglePause() {
  if(!game || !game.running) return;
  paused = !paused;
  document.getElementById("pauseMenu").style.display = paused ? "flex" : "none";
}
window.addEventListener("keydown", e => { if(e.key === "Escape") togglePause(); });
document.getElementById("continueGameBtn").addEventListener("click", () => { paused = false; document.getElementById("pauseMenu").style.display = "none"; });
document.getElementById("toStartBtn").addEventListener("click", () => { location.reload(); });

function showCenterMsg(title, buttons) {
  const centerMsg = document.getElementById("centerMsg");
  const centerBox = document.getElementById("centerBox");
  centerMsg.style.display = "flex";
  let buttonsHTML = '';
  buttons.forEach((button, index) => { buttonsHTML += `<button id="msgBtn_${index}">${button.text}</button>`; });
  centerBox.innerHTML = `<div style="font-size:18px;margin-bottom:12px;line-height:1.5;">${title}</div><div>${buttonsHTML}</div>`;
  buttons.forEach((button, index) => {
    document.getElementById(`msgBtn_${index}`).addEventListener("click", () => {
      centerMsg.style.display = "none"; button.callback();
    });
  }); 
}

function startGame(difficulty) {
    LEVELS = generateLongLevels(difficulty);

    game.start();
}
